# Supabase Configuration for Athletica
# This file configures the local Supabase development environment

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
minor_version = 5

[studio]
port = 54323
api_url = "http://localhost:54321"

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
email_double_confirm_changes = true
enable_confirmations = true
secure_email_change = true

[auth.email]
enable_signup = true
double_confirm_changes = true
confirm_url = ""

[auth.sms]
enable_signup = true

[auth.external]
# Enable providers as needed
# google = { enabled = true }
# github = { enabled = true }

[storage]
file_size_limit = "50MiB"
upload_quotas = { free = "1GiB", pro = "100GiB" }

[edge_runtime]
policy = "per_worker"